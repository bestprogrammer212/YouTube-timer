<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Timer Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0e1a;
            --bg-card: rgba(20, 25, 40, 0.7);
            --border: rgba(255,255,255,0.06);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --accent: #6366f1;
            --green: #22c55e;
            --yellow: #eab308;
            --red: #ef4444;
            --blue: #3b82f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0;
        }
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }
        .bg-orb-1 { width: 500px; height: 500px; background: var(--accent); top: -10%; left: -10%; animation: float 20s ease-in-out infinite; }
        .bg-orb-2 { width: 400px; height: 400px; background: var(--blue); bottom: -5%; right: -10%; animation: float 25s ease-in-out infinite reverse; }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 16px 100px;
        }
        .header {
            text-align: center;
            padding: 30px 0 20px;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }
        .header p { color: var(--text-muted); font-size: 0.9rem; }
        .header .next-reset {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 0.78rem;
            color: var(--text-dim);
        }
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }
        .stat-pill {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 10px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .stat-pill .stat-num { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
        .stat-pill .stat-label { font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
        .app-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }
        @media (min-width: 640px) { .app-grid { grid-template-columns: repeat(2, 1fr); } }
        .app-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(20px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .app-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--blue));
            opacity: 0;
            transition: opacity 0.3s;
        }
        .app-card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.12); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .app-card:hover::before { opacity: 1; }
        .app-card.locked { border-color: rgba(239, 68, 68, 0.3); box-shadow: 0 0 30px rgba(239,68,68,0.25); }
        .app-card.locked::before { background: linear-gradient(90deg, var(--red), #f97316); opacity: 1; }
        .app-card.open { border-color: rgba(34, 197, 94, 0.3); box-shadow: 0 0 30px rgba(34,197,94,0.25); }
        .app-card.open::before { background: linear-gradient(90deg, var(--green), #10b981); opacity: 1; }
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .app-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(59,130,246,0.2));
            border: 1px solid rgba(99,102,241,0.15);
        }
        .app-info { flex: 1; }
        .app-name { font-size: 1.05rem; font-weight: 700; color: var(--text); }
        .app-status {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-dim);
        }
        .status-dot.open { background: var(--green); box-shadow: 0 0 8px rgba(34,197,94,0.25); }
        .status-dot.locked { background: var(--red); box-shadow: 0 0 8px rgba(239,68,68,0.25); animation: pulse-dot 1.5s infinite; }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }
        .card-actions { display: flex; gap: 6px; }
        .btn-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .btn-icon:hover { background: rgba(255,255,255,0.08); color: var(--text); }
        .btn-icon.danger:hover { color: var(--red); border-color: rgba(239,68,68,0.3); }
        .timer-section { text-align: center; padding: 10px 0; }
        .timer-display {
            font-size: 3.2rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }
        .timer-display.warning {
            background: linear-gradient(135deg, var(--yellow), #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .timer-display.danger {
            background: linear-gradient(135deg, var(--red), #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .timer-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
        .progress-wrap { margin: 14px 0; }
        .progress-track {
            height: 8px;
            background: rgba(255,255,255,0.04);
            border-radius: 100px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            border-radius: 100px;
            background: linear-gradient(90deg, var(--accent), var(--blue));
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            right: 0; top: 0; bottom: 0;
            width: 20px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3));
            border-radius: 100px;
        }
        .progress-fill.warning { background: linear-gradient(90deg, var(--yellow), #f97316); }
        .progress-fill.danger { background: linear-gradient(90deg, var(--red), #f97316); }
        .progress-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.75rem;
            color: var(--text-dim);
        }
        .config-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .config-row input {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 12px;
            color: var(--text);
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            font-family: inherit;
        }
        .config-row input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }
        .config-row span { font-size: 0.8rem; color: var(--text-dim); white-space: nowrap; }
        .btn-save {
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-save:hover { transform: scale(1.05); box-shadow: 0 4px 20px rgba(99,102,241,0.3); }
        .btn-reset {
            background: rgba(34,197,94,0.1);
            color: var(--green);
            border: 1px solid rgba(34,197,94,0.2);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .btn-reset:hover { background: rgba(34,197,94,0.2); }
        .add-section { margin-top: 30px; text-align: center; }
        .add-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(99,102,241,0.3);
        }
        .add-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(99,102,241,0.3); }
        .add-btn .plus { font-size: 1.4rem; font-weight: 300; }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal {
            background: linear-gradient(180deg, #141928, #0f1320);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 28px;
            width: 100%;
            max-width: 400px;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.active .modal { transform: scale(1) translateY(0); }
        .modal h2 { font-size: 1.3rem; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input, .form-group select {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }
        .icon-picker {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-top: 8px;
        }
        .icon-option {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(0,0,0,0.2);
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .icon-option:hover { background: rgba(255,255,255,0.05); }
        .icon-option.selected { border-color: var(--accent); background: rgba(99,102,241,0.2); }
        .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
        .modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: inherit;
            border: none;
            transition: all 0.2s;
        }
        .btn-cancel { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--border) !important; }
        .btn-cancel:hover { background: rgba(255,255,255,0.1); }
        .btn-confirm { background: linear-gradient(135deg, var(--accent), #8b5cf6); color: white; }
        .btn-confirm:hover { box-shadow: 0 4px 20px rgba(99,102,241,0.3); }
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            color: white;
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 10px 40px rgba(99,102,241,0.4);
            z-index: 200;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
        .empty-state .empty-icon { font-size: 4rem; margin-bottom: 16px; opacity: 0.3; }
        .empty-state h3 { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 8px; }
        .loading { text-align: center; padding: 60px; color: var(--text-dim); }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(99,102,241,0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .app-id { font-size: 0.65rem; color: var(--text-dim); opacity: 0.5; font-family: monospace; margin-top: 4px; }
    </style>

<body>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <div class="app-container">
        <div class="header">
            <h1>⏱️ App Timer</h1>
            <p>Tägliche Limits für alle Apps</p>
            <div class="next-reset" id="nextReset">⏰ Nächster Reset: --</div>
        </div>

        <div class="stats-bar">
            <div class="stat-pill">
                <div class="stat-num" id="statTotal">0</div>
                <div class="stat-label">Apps</div>
            </div>
            <div class="stat-pill">
                <div class="stat-num" id="statActive">0</div>
                <div class="stat-label">Aktiv</div>
            </div>
            <div class="stat-pill">
                <div class="stat-num" id="statLocked">0</div>
                <div class="stat-label">Gesperrt</div>
            </div>
        </div>

        <div id="appGrid" class="app-grid">
            <div class="loading">
                <div class="spinner"></div>
                <div>Apps werden geladen...</div>
            </div>
        </div>

        <div class="add-section">
            <button class="add-btn" onclick="openModal()">
                <span class="plus">+</span>
                <span>Neue App hinzufügen</span>
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="modal" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <h2>Neue App</h2>
            <div class="form-group">
                <label>App-Name</label>
                <input type="text" id="newAppName" placeholder="z.B. Instagram" maxlength="20">
            </div>
            <div class="form-group">
                <label>Icon</label>
                <div class="icon-picker" id="iconPicker"></div>
            </div>
            <div class="form-group">
                <label>Tägliches Limit (Minuten)</label>
                <input type="number" id="newAppLimit" value="30" min="1" max="300">
            </div>
            <div class="form-group">
                <label>App-ID (für Kurzbefehle)</label>
                <input type="text" id="newAppId" placeholder="z.B. instagram" style="font-family:monospace;">
                <div style="font-size:0.7rem;color:var(--text-dim);margin-top:4px;">
                    Nur Kleinbuchstaben, keine Leerzeichen. Wird in der URL verwendet.
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Abbrechen</button>
                <button class="btn-confirm" onclick="addApp()">Hinzufügen</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ═══════════════════════════════════════
        // HIER DEINE FIREBASE URL EINTRAGEN!
        // ═══════════════════════════════════════
        const FIREBASE_URL = 'https://timer-57211-default-rtdb.europe-west1.firebasedatabase.app';
        // ═══════════════════════════════════════

        const ICONS = ['📱','🎮','📺','🎵','📸','💬','🐦','📰','🛒','🏋️','📖','🎬','🎨','🍿','🔴','📲','💻','🌐','📧','🗺️'];
        let selectedIcon = '📱';
        let appsData = {};
        let isResetting = false;

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function getToday() {
            return new Date().toISOString().split('T')[0];
        }

        function secondsUntilMidnight() {
            const n = new Date();
            const m = new Date(n);
            m.setDate(m.getDate() + 1);
            m.setHours(0, 0, 0, 0);
            return Math.floor((m - n) / 1000);
        }

        // ═══════════════════════════════════════
        // BERECHNE AKTUELLE ZEIT (inkl. offene Zeit)
        // ═══════════════════════════════════════

        function calculateLiveTimeUsed(app) {
            const timeUsed = app.timeUsed || 0;
            const limit = (app.timeLimit || 30) * 60;

            // Wenn App gerade offen ist, addiere die Zeit seit lastOpen
            if (app.isOpen && app.lastOpen) {
                const lastOpen = new Date(app.lastOpen);
                const now = new Date();
                const secondsOpen = Math.floor((now - lastOpen) / 1000);
                const total = timeUsed + secondsOpen;
                return {
                    total: total,
                    limit: limit,
                    remaining: Math.max(0, limit - total),
                    isOver: total >= limit,
                    percent: Math.min(100, (total / limit) * 100)
                };
            }

            // App ist geschlossen
            return {
                total: timeUsed,
                limit: limit,
                remaining: Math.max(0, limit - timeUsed),
                isOver: timeUsed >= limit,
                percent: Math.min(100, (timeUsed / limit) * 100)
            };
        }

        async function fetchApps() {
            try {
                const r = await fetch(`${FIREBASE_URL}/apps.json`);
                if (!r.ok) {
                    showToast(`❌ Firebase Fehler: ${r.status}`);
                    return null;
                }
                const raw = await r.json();

                if (raw === null) {
                    appsData = {};
                    return {};
                }

                const validApps = {};
                for (const [key, val] of Object.entries(raw)) {
                    if (val && typeof val === 'object' && val.name && typeof val.name === 'string') {
                        validApps[key] = val;
                    }
                }

                appsData = validApps;
                return validApps;
            } catch(e) {
                showToast('❌ Netzwerkfehler');
                return null;
            }
        }

        async function patchApp(appId, data) {
            try {
                const r = await fetch(`${FIREBASE_URL}/apps/${appId}.json`, {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                return r.ok;
            } catch(e) {
                showToast('❌ Speichern fehlgeschlagen');
                return false;
            }
        }

        async function deleteApp(appId) {
            if (!confirm(`„${appsData[appId]?.name || appId}" wirklich löschen?`)) return;
            try {
                await fetch(`${FIREBASE_URL}/apps/${appId}.json`, {method: 'DELETE'});
                showToast('🗑️ App gelöscht');
                await loadAll();
            } catch(e) {
                showToast('❌ Fehler beim Löschen');
            }
        }

        async function checkDailyReset() {
            if (isResetting) return;
            const today = getToday();
            let needsReset = false;
            const appsToReset = [];

            for (const [id, app] of Object.entries(appsData)) {
                if (app.lastResetDate !== today) {
                    needsReset = true;
                    appsToReset.push(id);
                }
            }

            if (!needsReset) return;
            isResetting = true;

            for (const id of appsToReset) {
                await patchApp(id, {
                    timeUsed: 0,
                    locked: false,
                    lastResetDate: today,
                    lastOpen: new Date().toISOString()
                });
            }

            showToast('🌙 Täglicher Reset durchgeführt');
            await fetchApps();
            isResetting = false;
        }

        function formatTime(sec) {
            const m = Math.floor(Math.abs(sec) / 60).toString().padStart(2, '0');
            const s = Math.abs(sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function renderApps() {
            const grid = document.getElementById('appGrid');
            const ids = Object.keys(appsData);

            document.getElementById('statTotal').textContent = ids.length;
            document.getElementById('statActive').textContent = ids.filter(id => appsData[id].isOpen).length;
            document.getElementById('statLocked').textContent = ids.filter(id => appsData[id].locked).length;

            const sec = secondsUntilMidnight();
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60000);
            document.getElementById('nextReset').textContent = `⏰ Nächster Reset in ${h}h ${m}min`;

            if (ids.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1;">
                        <div class="empty-icon">📱</div>
                        <h3>Noch keine Apps</h3>
                        <p>Füge oben deine erste App hinzu</p>
                    </div>`;
                return;
            }

            grid.innerHTML = ids.map(id => {
                const app = appsData[id];

                // LIVE Berechnung - inkl. Zeit seit lastOpen wenn offen
                const live = calculateLiveTimeUsed(app);

                const isLocked = app.locked || live.isOver;
                const isOpen = app.isOpen || false;

                let timerClass = '';
                let progressClass = '';
                if (live.percent > 90) { timerClass = 'danger'; progressClass = 'danger'; }
                else if (live.percent > 70) { timerClass = 'warning'; progressClass = 'warning'; }

                let statusText = 'Geschlossen';
                let statusDotClass = '';
                if (isLocked) { statusText = 'Gesperrt'; statusDotClass = 'locked'; }
                else if (isOpen) { statusText = 'Geöffnet – Timer läuft'; statusDotClass = 'open'; }

                return `
                    <div class="app-card ${isLocked ? 'locked' : ''} ${isOpen ? 'open' : ''}" data-id="${id}">
                        <div class="card-header">
                            <div class="app-icon">${app.icon || '📱'}</div>
                            <div class="app-info">
                                <div class="app-name">${app.name || id}</div>
                                <div class="app-status">
                                    <span class="status-dot ${statusDotClass}"></span>
                                    ${statusText}
                                </div>
                                <div class="app-id">ID: ${id}</div>
                            </div>
                            <div class="card-actions">
                                <button class="btn-icon danger" onclick="deleteApp('${id}')" title="Löschen">🗑️</button>
                            </div>
                        </div>

                        <div class="timer-section">
                            <div class="timer-display ${timerClass}">${formatTime(live.remaining)}</div>
                            <div class="timer-label">Verbleibend</div>
                        </div>

                        <div class="progress-wrap">
                            <div class="progress-track">
                                <div class="progress-fill ${progressClass}" style="width:${live.percent}%"></div>
                            </div>
                            <div class="progress-stats">
                                <span>${(live.total/60).toFixed(1)} Min genutzt</span>
                                <span>${(live.limit/60)} Min Limit</span>
                            </div>
                        </div>

                        <div class="config-row">
                            <input type="number" value="${app.timeLimit || 30}" 
                                min="1" max="300" 
                                onchange="updateLimit('${id}', this.value)">
                            <span>Min</span>
                            <button class="btn-save" onclick="updateLimit('${id}', this.parentElement.querySelector('input').value)">💾</button>
                            <button class="btn-reset" onclick="resetApp('${id}')">↺ Reset</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function updateLimit(id, val) {
            const limit = parseInt(val);
            if (limit < 1 || limit > 300) {
                showToast('❌ Limit: 1–300 Min');
                return;
            }
            const ok = await patchApp(id, { timeLimit: limit });
            if (ok) {
                showToast(`✅ ${appsData[id]?.name || id}: ${limit} Min`);
                await fetchApps();
                renderApps();
            }
        }

        async function resetApp(id) {
            const ok = await patchApp(id, {
                timeUsed: 0,
                locked: false,
                lastResetDate: getToday(),
                lastOpen: new Date().toISOString()
            });
            if (ok) {
                showToast(`🔄 ${appsData[id]?.name || id} zurückgesetzt`);
                await fetchApps();
                renderApps();
            }
        }

        function openModal() {
            document.getElementById('modal').classList.add('active');
            document.getElementById('newAppName').focus();
        }
        function closeModal(e) {
            if (!e || e.target === document.getElementById('modal')) {
                document.getElementById('modal').classList.remove('active');
            }
        }

        function renderIconPicker() {
            const picker = document.getElementById('iconPicker');
            picker.innerHTML = ICONS.map(ic => 
                `<div class="icon-option ${ic === selectedIcon ? 'selected' : ''}" onclick="selectIcon(this, '${ic}')">${ic}</div>`
            ).join('');
        }
        function selectIcon(el, ic) {
            selectedIcon = ic;
            document.querySelectorAll('.icon-option').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
        }

        async function addApp() {
            const name = document.getElementById('newAppName').value.trim();
            let id = document.getElementById('newAppId').value.trim().toLowerCase();
            const limit = parseInt(document.getElementById('newAppLimit').value);

            if (!name) { showToast('❌ Name eingeben'); return; }
            if (!id) id = name.toLowerCase().replace(/[^a-z0-9]/g, '');
            if (!id) { showToast('❌ Ungültige ID'); return; }
            if (appsData[id]) { showToast('❌ ID existiert bereits'); return; }

            const newApp = {
                name: name,
                icon: selectedIcon,
                timeLimit: limit || 30,
                timeUsed: 0,
                locked: false,
                isOpen: false,
                lastResetDate: getToday(),
                lastOpen: new Date().toISOString()
            };

            const ok = await patchApp(id, newApp);
            if (ok) {
                showToast(`✅ „${name}" hinzugefügt`);
                document.getElementById('newAppName').value = '';
                document.getElementById('newAppId').value = '';
                closeModal();
                await loadAll();
            }
        }

        async function loadAll() {
            const result = await fetchApps();
            if (result !== null) {
                await checkDailyReset();
                renderApps();
            } else {
                document.getElementById('appGrid').innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1;">
                        <div class="empty-icon">⚠️</div>
                        <h3>Fehler beim Laden</h3>
                        <p>Firebase konnte nicht erreicht werden.</p>
                    </div>`;
            }
        }

        // Init
        renderIconPicker();
        loadAll();

        // Jede Sekunde aktualisieren (nur UI, kein Firebase-Call)
        // Die Zeit wird lokal aus lastOpen berechnet
        setInterval(renderApps, 1000);

        // Alle 10 Sekunden von Firebase neu laden
        setInterval(loadAll, 10000);
    </script>
</body>
</html>

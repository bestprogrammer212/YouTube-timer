<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Daily Timer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #f85149; margin-bottom: 5px; font-size: 1.4rem; }
        .subtitle { color: #8b949e; font-size: 0.85rem; margin-bottom: 25px; }

        .status-box {
            padding: 20px;
            border-radius: 12px;
            background: #21262d;
            margin-bottom: 20px;
            border: 2px solid #30363d;
        }
        .status-box.open { border-color: #3fb950; }
        .status-box.closed { border-color: #8b949e; }
        .status-box.locked { border-color: #f85149; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0%, 100% { border-color: #f85149; }
            50% { border-color: #610b0b; }
        }

        .status-icon { font-size: 2.5rem; margin-bottom: 8px; }
        .status-text { font-size: 1.2rem; font-weight: 600; }

        .timer-display {
            font-size: 4.5rem;
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            margin: 25px 0;
            color: #58a6ff;
            letter-spacing: -2px;
        }
        .timer-display.warning { color: #d29922; }
        .timer-display.danger { color: #f85149; }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #21262d;
            border-radius: 4px;
            overflow: hidden;
            margin: 15px 0;
        }
        .progress-fill {
            height: 100%;
            background: #3fb950;
            border-radius: 4px;
            transition: width 0.5s, background 0.5s;
        }
        .progress-fill.warning { background: #d29922; }
        .progress-fill.danger { background: #f85149; }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }
        .stat-box {
            background: #0d1117;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }
        .stat-label { font-size: 0.75rem; color: #8b949e; text-transform: uppercase; }
        .stat-value { font-size: 1.1rem; font-weight: 600; margin-top: 4px; }

        .config-section {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        .config-title { font-size: 0.9rem; color: #8b949e; margin-bottom: 12px; text-align: left; }
        .config-row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }
        input[type="number"] {
            background: #161b22;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 10px 14px;
            border-radius: 8px;
            width: 100px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
        }
        input:focus { outline: none; border-color: #58a6ff; }

        button {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        button:hover { background: #2ea043; }
        button.secondary {
            background: #1f6feb;
            margin-top: 10px;
        }
        button.secondary:hover { background: #388bfd; }
        button.danger {
            background: #da3633;
        }
        button.danger:hover { background: #f85149; }

        .reset-info {
            margin-top: 15px;
            padding: 12px;
            background: #1f6feb20;
            border: 1px solid #1f6feb40;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #58a6ff;
        }

        .log {
            margin-top: 20px;
            text-align: left;
            font-size: 0.78rem;
            max-height: 140px;
            overflow-y: auto;
            background: #0d1117;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }
        .log-entry { margin: 3px 0; color: #8b949e; }
        .log-entry.reset { color: #3fb950; }
        .log-entry.error { color: #f85149; }

        .next-reset {
            font-size: 0.8rem;
            color: #8b949e;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📺 YouTube Daily Timer</h1>
        <p class="subtitle">Tägliches Limit &middot; Reset um 00:00 Uhr</p>

        <div id="statusBox" class="status-box closed">
            <div class="status-icon" id="statusIcon">⏹️</div>
            <div class="status-text" id="statusText">Geschlossen</div>
        </div>

        <div class="timer-display" id="timerDisplay">30:00</div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Limit</div>
                <div class="stat-value" id="statLimit">30 Min</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Genutzt</div>
                <div class="stat-value" id="statUsed">0 Min</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Verbleibend</div>
                <div class="stat-value" id="statLeft">30 Min</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Status</div>
                <div class="stat-value" id="statLocked">Frei</div>
            </div>
        </div>

        <div class="config-section">
            <div class="config-title">⚙️ Tägliches Limit einstellen</div>
            <div class="config-row">
                <input type="number" id="limitInput" value="30" min="1" max="300">
                <span style="color:#8b949e">Minuten</span>
                <button onclick="saveLimit()">Speichern</button>
            </div>
            <button class="secondary" onclick="manualReset()">🔄 Jetzt zurücksetzen</button>
            <div class="reset-info">
                ⏰ Automatischer Reset jeden Tag um <strong>00:00 Uhr</strong>
            </div>
            <div class="next-reset" id="nextReset"></div>
        </div>

        <div class="log" id="log"></div>
    </div>

    <script>
        // ═══════════════════════════════════════
        // HIER DEINE FIREBASE URL EINTRAGEN!
        // ═══════════════════════════════════════
        const FIREBASE_URL = 'https://timer-57211-default-rtdb.europe-west1.firebasedatabase.app';
        // ═══════════════════════════════════════

        let timerInterval;
        let currentData = {};
        let midnightTimeout;

        function log(msg, type = '') {
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            entry.textContent = `[${new Date().toLocaleTimeString('de-CH')}] ${msg}`;
            const logEl = document.getElementById('log');
            logEl.prepend(entry);
            if (logEl.children.length > 50) logEl.lastChild.remove();
        }

        function getTodayString() {
            return new Date().toISOString().split('T')[0];
        }

        function getSecondsUntilMidnight() {
            const now = new Date();
            const midnight = new Date(now);
            midnight.setDate(midnight.getDate() + 1);
            midnight.setHours(0, 0, 0, 0);
            return midnight - now;
        }

        async function fetchData() {
            try {
                const res = await fetch(`${FIREBASE_URL}/youtube_timer.json`);
                currentData = await res.json() || {};
                return currentData;
            } catch (e) {
                log('Fehler beim Laden: ' + e.message, 'error');
                return {};
            }
        }

        async function patchData(data) {
            try {
                await fetch(`${FIREBASE_URL}/youtube_timer.json`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                return true;
            } catch (e) {
                log('Fehler beim Speichern: ' + e.message, 'error');
                return false;
            }
        }

        async function checkAndResetDaily() {
            const today = getTodayString();
            const data = await fetchData();

            if (data.lastResetDate !== today) {
                await patchData({
                    timeUsed: 0,
                    locked: false,
                    lastResetDate: today
                });
                log('🌙 Täglicher Reset durchgeführt: ' + today, 'reset');
                await fetchData();
            }
        }

        function scheduleMidnightReset() {
            if (midnightTimeout) clearTimeout(midnightTimeout);
            const ms = getSecondsUntilMidnight();
            const hours = Math.floor(ms / 3600000);
            const mins = Math.floor((ms % 3600000) / 60000);
            document.getElementById('nextReset').textContent = 
                `Nächster Reset in ${hours}h ${mins}min`;

            midnightTimeout = setTimeout(async () => {
                await checkAndResetDaily();
                scheduleMidnightReset();
            }, ms);
        }

        function formatTime(seconds) {
            const m = Math.floor(Math.abs(seconds) / 60).toString().padStart(2, '0');
            const s = Math.abs(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateUI() {
            const limit = (currentData.timeLimit || 30) * 60;
            const used = currentData.timeUsed || 0;
            const left = Math.max(0, limit - used);
            const percent = Math.min(100, (used / limit) * 100);
            const isLocked = currentData.locked || false;
            const isOpen = currentData.isOpen || false;

            // Status Box
            const box = document.getElementById('statusBox');
            const icon = document.getElementById('statusIcon');
            const text = document.getElementById('statusText');

            box.className = 'status-box';
            if (isLocked) {
                box.classList.add('locked');
                icon.textContent = '🔒';
                text.textContent = 'GESPERRT – Limit erreicht!';
            } else if (isOpen) {
                box.classList.add('open');
                icon.textContent = '▶️';
                text.textContent = 'YouTube geöffnet – Timer läuft';
            } else {
                box.classList.add('closed');
                icon.textContent = '⏹️';
                text.textContent = 'YouTube geschlossen';
            }

            // Timer
            const timerEl = document.getElementById('timerDisplay');
            timerEl.textContent = formatTime(left);
            timerEl.className = 'timer-display';
            if (percent > 90) timerEl.classList.add('danger');
            else if (percent > 70) timerEl.classList.add('warning');

            // Progress
            const fill = document.getElementById('progressFill');
            fill.style.width = percent + '%';
            fill.className = 'progress-fill';
            if (percent > 90) fill.classList.add('danger');
            else if (percent > 70) fill.classList.add('warning');

            // Stats
            document.getElementById('statLimit').textContent = (limit / 60) + ' Min';
            document.getElementById('statUsed').textContent = (used / 60).toFixed(1) + ' Min';
            document.getElementById('statLeft').textContent = (left / 60).toFixed(1) + ' Min';
            document.getElementById('statLocked').textContent = isLocked ? '🔒 Gesperrt' : '✅ Frei';
            document.getElementById('statLocked').style.color = isLocked ? '#f85149' : '#3fb950';

            // Local timer if open
            if (isOpen && !isLocked) {
                if (!timerInterval) {
                    timerInterval = setInterval(async () => {
                        currentData.timeUsed = (currentData.timeUsed || 0) + 1;
                        // Auto-lock if limit reached
                        if (currentData.timeUsed >= limit) {
                            currentData.locked = true;
                            currentData.isOpen = false;
                            await patchData({ locked: true, isOpen: false });
                            log('⛔ Limit erreicht! YouTube wird gesperrt.', 'error');
                        }
                        updateUI();
                    }, 1000);
                }
            } else {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        async function saveLimit() {
            const limit = parseInt(document.getElementById('limitInput').value);
            if (limit < 1 || limit > 300) {
                log('Limit muss zwischen 1 und 300 Minuten sein', 'error');
                return;
            }
            await patchData({ timeLimit: limit });
            log(`✅ Limit auf ${limit} Minuten gesetzt`);
            await fetchData();
            updateUI();
        }

        async function manualReset() {
            const today = getTodayString();
            await patchData({
                timeUsed: 0,
                locked: false,
                lastResetDate: today
            });
            log('🔄 Manueller Reset durchgeführt', 'reset');
            await fetchData();
            updateUI();
        }

        async function init() {
            log('Dashboard wird gestartet...');
            await checkAndResetDaily();
            await fetchData();
            updateUI();
            scheduleMidnightReset();

            // Alle 10 Sekunden synchronisieren
            setInterval(async () => {
                await fetchData();
                updateUI();
            }, 10000);
        }

        init();
    </script>
</body>
</html>
